            schema:
              $ref: '#/components/schemas/PatchedDealUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDealUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDealUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
