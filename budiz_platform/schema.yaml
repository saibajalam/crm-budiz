      - in: path
        name: deal_id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DealUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DealUpdateRequest'
        required: true
      security:
