  /api/leads/:
    get:
      operationId: leads_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - cold_call
          - email_campaign
          - event
          - other
          - referral
          - social_media
          - website
        description: |-
          * `website` - Website
          * `referral` - Referral
          * `social_media` - Social Media
          * `email_campaign` - Email Campaign
          * `event` - Event
          * `cold_call` - Cold Call
          * `other` - Other

          * `website` - Website
          * `referral` - Referral
          * `social_media` - Social Media
          * `email_campaign` - Email Campaign
          * `event` - Event
          * `cold_call` - Cold Call
          * `other` - Other
      - in: query
        name: status
        schema:
          type: string
          enum:
          - contacted
          - converted
          - lost
          - new
          - qualified
          - unqualified
        description: |-
          * `new` - New
          * `contacted` - Contacted
          * `qualified` - Qualified
          * `converted` - Converted
          * `unqualified` - Unqualified
          * `lost` - Lost

          * `new` - New
          * `contacted` - Contacted
          * `qualified` - Qualified
          * `converted` - Converted
          * `unqualified` - Unqualified
          * `lost` - Lost
      tags:
      - leads
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeadListList'
          description: ''
    post:
      operationId: leads_create
      tags:
