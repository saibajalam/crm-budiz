        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealUpdate'
          description: ''
    delete:
      operationId: deals_destroy
      parameters:
      - in: path
        name: deal_id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/deals/{deal_id}/activities/:
    post:
      operationId: deals_activities_create
      description: Create a new deal activity
      parameters:
      - in: header
        name: X-Workspace-ID
