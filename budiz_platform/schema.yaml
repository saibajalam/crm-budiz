openapi: 3.0.3
info:
  title: CRM API
  version: 1.0.0
  description: Multi-workspace CRM backend APIs
paths:
  /api/activate_subscription/:
    post:
      operationId: activate_subscription_create
      description: Activate a subscription plan for user or company
      parameters:
      - in: query
        name: plan_id
        schema:
          type: string
        description: Subscription plan ID
        required: true
      tags:
      - Subscriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateSubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivateSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivateSubscriptionRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Subscription activated
        '400':
          description: Invalid plan_id
        '404':
          description: Plan not found
  /api/admin/:
    get:
      operationId: admin_retrieve
      description: Get Admin dashboard overview
      tags:
      - Dashboards
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Admin dashboard data
  /api/analytics/dashboard/:
    get:
      operationId: analytics_dashboard_retrieve
      description: Get analytics dashboard summary with deals and leads statistics
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: integer
        description: Workspace ID for multi-tenant isolation
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days for analytics
      tags:
      - Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
          description: ''
  /api/analytics/deals/:
    get:
      operationId: analytics_deals_list
      description: Get daily deal analytics with aggregated metrics
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: integer
        description: Workspace ID for multi-tenant isolation
      - in: query
        name: end_date
        schema:
          type: string
        description: End date (YYYY-MM-DD)
      - in: query
        name: start_date
        schema:
          type: string
        description: Start date (YYYY-MM-DD)
      tags:
      - Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DealAnalytics'
          description: ''
  /api/analytics/trends/:
    get:
      operationId: analytics_trends_retrieve
      description: Get analytics trends over time
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: integer
        description: Workspace ID for multi-tenant isolation
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days
      - in: query
        name: metric
        schema:
          type: string
        description: Metric type (won_value, total_deals)
      tags:
      - Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Trend data
  /api/analytics/users/:
    get:
      operationId: analytics_users_list
      description: Get user-wise analytics for deals and revenue
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: integer
        description: Workspace ID for multi-tenant isolation
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days for analytics
      tags:
      - Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAnalytics'
          description: ''
  /api/analytics/users/{user_id}/:
    get:
      operationId: analytics_users_retrieve
      description: Get detailed analytics for a specific user
      parameters:
      - in: header
        name: X-Workspace-ID
        schema:
          type: integer
        description: Workspace ID for multi-tenant isolation
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days for analytics
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAnalytics'
          description: ''
  /api/company_status/:
